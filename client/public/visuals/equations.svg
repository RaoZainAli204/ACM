<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title"><title id="title">Three circles equal twelve; circle plus two triangles equals ten; triangle plus square equals seven; find circle plus triangle times square</title><rect width="360" height="280" fill="#f7f8ee"/><defs><g id="circle"><circle r="13" fill="#a8cf71" stroke="#14201a" stroke-width="2"/></g><g id="triangle"><polygon points="0,-15 -14,12 14,12" fill="#f0b778" stroke="#14201a" stroke-width="2"/></g><g id="square"><rect x="-13" y="-13" width="26" height="26" fill="#adc7d5" stroke="#14201a" stroke-width="2"/></g></defs><g font-family="Arial,sans-serif" font-size="22" fill="#14201a" text-anchor="middle"><use href="#circle" x="62" y="42"/><text x="94" y="50">+</text><use href="#circle" x="128" y="42"/><text x="162" y="50">+</text><use href="#circle" x="196" y="42"/><text x="231" y="50">=</text><text x="279" y="50">12</text><use href="#circle" x="62" y="103"/><text x="94" y="111">+</text><use href="#triangle" x="128" y="103"/><text x="162" y="111">+</text><use href="#triangle" x="196" y="103"/><text x="231" y="111">=</text><text x="279" y="111">10</text><use href="#triangle" x="94" y="164"/><text x="128" y="172">+</text><use href="#square" x="162" y="164"/><text x="196" y="172">=</text><text x="244" y="172">7</text><path d="M30 199h300" stroke="#a2ac93"/><use href="#circle" x="62" y="238"/><text x="94" y="246">+</text><use href="#triangle" x="128" y="238"/><text x="162" y="246">×</text><use href="#square" x="196" y="238"/><text x="231" y="246">=</text><text x="279" y="246" font-weight="bold">?</text></g></svg>
