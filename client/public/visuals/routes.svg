<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title"><title id="title">Three by three grid with start at outer top-left, finish at outer bottom-right, and right or down moves allowed</title><rect width="360" height="280" fill="#f7f8ee"/><g fill="none" stroke="#14201a" stroke-width="3"><rect x="90" y="38" width="180" height="180"/><path d="M150 38v180M210 38v180M90 98h180M90 158h180"/></g><circle cx="90" cy="38" r="7" fill="#44662a" stroke="#14201a" stroke-width="2"/><rect x="264" y="212" width="12" height="12" fill="#14201a"/><g fill="#14201a" font-family="Arial,sans-serif" font-size="12"><text x="28" y="24">START</text><text x="281" y="240">FINISH</text><text x="180" y="262" text-anchor="middle" font-size="14">ALLOWED MOVES: RIGHT → OR DOWN ↓</text></g></svg>
